openapi: 3.0.3
info:
  title: TechSupply ERP — Contabilidad, sprint 4
  version: 0.9.0
  description: Cuentas, periodos, ciclo manual, mayor, balance de prueba, integración de factura de venta, CxC, cobros/aplicaciones e integración transaccional de Compras e Inventario; V21 añade factura de proveedor y CxP, dentro de sus límites documentados.
servers:
- url: /api/v1
security:
- bearerAuth: []
x-implementation-status: partial
paths:
  /accounting/accounts:
    get:
      operationId: listAccountingAccounts
      summary: Consultar cuentas
      description: Requiere CONTABILIDAD_CUENTAS_LEER. Paginación limitada y orden estable; incluye cuentas inactivas.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/AccountSort'
      - $ref: '#/components/parameters/AccountDirection'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createAccountingAccount
      summary: Crear cuenta
      description: Requiere CONTABILIDAD_CUENTAS_ADMIN. Código normalizado en mayúsculas; padre activo, agrupador
        y sin partidas. El nivel se deriva del padre.
      parameters: []
      responses:
        '201':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CuentaCreate'
    x-implementation-status: implemented
  /accounting/accounts/{id}:
    get:
      operationId: getAccountingAccount
      summary: Consultar cuenta
      description: Requiere CONTABILIDAD_CUENTAS_LEER.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    x-implementation-status: implemented
    put:
      operationId: updateAccountingAccount
      summary: Actualizar cuenta
      description: Requiere CONTABILIDAD_CUENTAS_ADMIN. Con partidas solo se permite cambiar el nombre; un padre
        no acepta movimientos. No se reubica una cuenta con hijas. Un código preexistente conserva su grafía si
        solo cambia el uso de mayúsculas.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CuentaCreate'
      responses:
        '200':
          description: Cuenta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /accounting/periods:
    get:
      operationId: listAccountingPeriods
      summary: Consultar periodos
      description: Requiere CONTABILIDAD_PERIODOS_LEER. Paginación limitada y orden estable.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/PeriodSort'
      - $ref: '#/components/parameters/PeriodDirection'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createAccountingPeriod
      summary: Crear periodo
      description: Requiere CONTABILIDAD_PERIODOS_ADMIN. Fechas pasadas o futuras, límites inclusivos y periodos
        no solapados; rango invertido 400 y solapamiento 409.
      parameters: []
      responses:
        '201':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Periodo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodoCreate'
            example:
              fechaInicio: '2026-01-01'
              fechaFin: '2026-01-31'
    x-implementation-status: implemented
  /accounting/periods/{id}:
    get:
      operationId: getAccountingPeriod
      summary: Consultar periodo
      description: Requiere CONTABILIDAD_PERIODOS_LEER.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Periodo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    x-implementation-status: implemented
  /accounting/periods/{id}/close:
    post:
      operationId: closeAccountingPeriod
      summary: Cerrar periodo
      description: Requiere CONTABILIDAD_PERIODOS_CERRAR. Rechaza borradores con 409; cierre repetido devuelve el
        periodo sin nueva auditoría. No existe reapertura.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Periodo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    x-implementation-status: implemented
  /accounting/periods/{periodId}/accounts/{accountId}/ledger:
    get:
      operationId: getAccountingAccountLedger
      summary: Consultar mayor de una cuenta
      description: >-
        Requiere CONTABILIDAD_REPORTES_LEER. Incluye saldo inicial anterior al periodo,
        partidas contabilizadas/reversadas en orden cronológico y saldo final. Los
        borradores y cancelados se excluyen; el contraasiento compensa al original reversado.
      parameters:
      - $ref: '#/components/parameters/PeriodId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Mayor paginado con saldos y totales del periodo completo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroMayor'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    x-implementation-status: implemented
  /accounting/entries:
    get:
      operationId: listAccountingEntries
      summary: Consultar asientos
      description: Requiere CONTABILIDAD_ASIENTOS_LEER. Devuelve el asiento con sus partidas.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/EntrySort'
      - $ref: '#/components/parameters/EntryDirection'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsientoPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createAccountingEntry
      summary: Crear asiento manual en borrador
      description: Requiere CONTABILIDAD_ASIENTOS_REGISTRAR. La clave equivalente retorna el mismo asiento;
        contenido incompatible produce 409. El borrador no afecta saldos definitivos. Requiere periodo abierto,
        fecha incluida y cuentas activas que acepten movimientos. Cada partida debe tener exactamente un lado positivo.
      parameters: []
      responses:
        '201':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asiento'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          description: Reintento equivalente de creación; devuelve el asiento existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asiento'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsientoCreate'
            example:
              periodoId: 1
              fechaContable: '2026-11-12'
              descripcion: Ejemplo ilustrativo
              claveIdempotencia: ejemplo-asiento-001
              partidas:
              - cuentaId: 1
                debe: 100.0
                haber: 0
              - cuentaId: 2
                debe: 0
                haber: 100.0
    x-implementation-status: implemented
  /accounting/entries/{id}:
    get:
      operationId: getAccountingEntry
      summary: Consultar asiento
      description: Requiere CONTABILIDAD_ASIENTOS_LEER. Devuelve el asiento con sus partidas.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asiento'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    x-implementation-status: implemented
  /accounting/entries/{id}/cancel:
    post:
      operationId: cancelAccountingEntryDraft
      summary: Cancelar borrador con motivo
      description: Requiere CONTABILIDAD_ASIENTOS_REGISTRAR. Conserva el asiento y registra actor, instante y motivo.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorradorCancel'
      responses:
        '200':
          description: Borrador cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asiento'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    x-implementation-status: implemented
  /accounting/entries/{id}/edit:
    put:
      operationId: editAccountingEntryDraft
      summary: Editar borrador con motivo
      description: Requiere CONTABILIDAD_ASIENTOS_REGISTRAR. El periodo no cambia; fecha, descripción y partidas se reemplazan en periodo abierto.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorradorEdit'
      responses:
        '200':
          description: Borrador actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asiento'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    x-implementation-status: implemented
  /accounting/entries/{id}/post:
    post:
      operationId: postAccountingEntry
      summary: Contabilizar asiento
      description: Requiere CONTABILIDAD_ASIENTOS_CONTABILIZAR. Periodo abierto, fecha incluida, mínimo dos partidas y balance exacto.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asiento'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    x-implementation-status: implemented
  /accounting/entries/{id}/reverse:
    post:
      operationId: reverseAccountingEntry
      summary: Revertir asiento mediante contraasiento
      description: Requiere CONTABILIDAD_ASIENTOS_REVERTIR. Crea contraasiento inmutable; fecha explícita dentro de cualquier periodo abierto; reintento equivalente devuelve el mismo.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asiento'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversionCreate'
            example:
              fechaContable: '2026-11-12'
              motivo: Ejemplo ilustrativo
              claveIdempotencia: ejemplo-reversion-001
    x-implementation-status: implemented
  /accounting/accounts/{id}/status:
    x-implementation-status: implemented
    patch:
      operationId: setAccountingAccountStatus
      summary: Cambiar estado de cuenta
      description: Requiere CONTABILIDAD_CUENTAS_ADMIN. Una cuenta con partidas no puede darse de baja; reintentar
        el mismo estado no registra un cambio adicional.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CuentaEstado'
      responses:
        '200':
          description: Cuenta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /accounting/integrations/sales-invoices:
    get:
      operationId: listPendingSalesInvoiceIntegrations
      summary: Consultar facturas pendientes de integración contable
      description: Requiere CONTABILIDAD_INTEGRACIONES_LEER. La señal se persiste en la transacción de emisión; no incluye facturas históricas emitidas antes de V17.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página estable de integraciones pendientes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegracionFacturaVentaPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    x-implementation-status: implemented
  /accounting/accounts-receivable:
    get:
      operationId: listAccountsReceivable
      summary: Consultar auxiliar de cuentas por cobrar
      description: >-
        Requiere CONTABILIDAD_CXC_LEER. Incluye facturas nuevas cuya integración contable quedó contabilizada.
        El saldo pendiente se deriva del importe original menos aplicaciones confirmadas; como aún no se registran cobros,
        en esta versión coincide con el importe original. No incluye facturas históricas.
      parameters:
      - name: clienteId
        in: query
        required: false
        schema: { type: integer, format: int64, minimum: 1 }
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página ordenada por fecha de emisión descendente e identificador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CuentaPorCobrarPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    x-implementation-status: implemented
  /accounting/accounts-receivable/{id}:
    get:
      operationId: getAccountReceivable
      summary: Consultar cuenta por cobrar
      description: Requiere CONTABILIDAD_CXC_LEER. El saldo se calcula desde el importe original y las aplicaciones confirmadas.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Auxiliar de la factura contabilizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CuentaPorCobrar' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    x-implementation-status: implemented
  /accounting/integrations/sales-invoices/accounts:
    get:
      operationId: getSalesInvoiceAccountingAccounts
      summary: Consultar mapeo de cuentas de factura
      description: Requiere CONTABILIDAD_INTEGRACIONES_ADMIN. Si falta una cuenta, la integración permanece pendiente.
      responses:
        '200':
          description: Configuración actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracionFacturaVenta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: configureSalesInvoiceAccountingAccounts
      summary: Configurar cuentas para factura de venta
      description: >-
        Requiere CONTABILIDAD_INTEGRACIONES_ADMIN. Cuentas activas distintas:
        activo/deudora, ingreso/acreedor y pasivo/acreedor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfiguracionFacturaVentaWrite' }
      responses:
        '200':
          description: Mapeo sustituido de forma atómica
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracionFacturaVenta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    x-implementation-status: implemented
  /accounting/integrations/sales-invoices/{invoiceId}:
    get:
      operationId: getSalesInvoiceAccountingIntegration
      summary: Consultar estado contable de una factura
      description: Requiere CONTABILIDAD_INTEGRACIONES_LEER. Incluye solo estado, contador y código seguro del último fallo.
      parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Estado de integración
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegracionFacturaVenta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    x-implementation-status: implemented
  /accounting/integrations/sales-invoices/{invoiceId}/retry:
    post:
      operationId: retrySalesInvoiceAccountingIntegration
      summary: Reintentar contabilización de una factura
      description: Requiere CONTABILIDAD_INTEGRACIONES_REINTENTAR, CONTABILIDAD_ASIENTOS_REGISTRAR y CONTABILIDAD_ASIENTOS_CONTABILIZAR. Si la fecha de emisión pertenece a un periodo abierto se usa; si no, exige una fecha explícita en cualquier periodo abierto. La factura permanece emitida si falla.
      parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReintentoFacturaVenta' }
      responses:
        '200':
          description: Estado actualizado; repetir una factura ya integrada devuelve el mismo asiento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegracionFacturaVenta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    x-implementation-status: implemented
  /accounting/customer-receipts:
    post:
      operationId: registerCustomerReceipt
      summary: Registrar cobro pendiente de confirmación
      description: Requiere CONTABILIDAD_COBROS_REGISTRAR. Idempotente; registrar no acredita recepción de fondos ni modifica CxC.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CobroCreate' }
      responses:
        '200': { description: Cobro registrado, content: { application/json: { schema: { $ref: '#/components/schemas/Cobro' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    x-implementation-status: implemented
  /accounting/customer-receipts/{id}:
    get:
      operationId: getCustomerReceipt
      summary: Consultar cobro y monto disponible
      description: Requiere CONTABILIDAD_COBROS_LEER.
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
