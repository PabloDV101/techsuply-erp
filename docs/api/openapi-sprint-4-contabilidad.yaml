        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token opaco existente; los permisos contables se definen en migraciones Flyway.
  parameters:
    PeriodId:
      name: periodId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        default: 20
    EntrySort:
      name: sort
      in: query
      schema:
        type: string
        enum: [id, folio, fechaContable]
        default: fechaContable
    EntryDirection:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    AccountSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
        - id
        - codigo
        - nombre
        default: codigo
    AccountDirection:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
    PeriodSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
        - id
        - fechaInicio
        - fechaFin
        default: fechaInicio
    PeriodDirection:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Autenticación requerida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Permiso insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Estado o solicitud incompatible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    PagoProveedor:
      type: object
      required: [id, folio, proveedorId, fechaPago, monto, medio, estado, aplicaciones]
      properties:
        id: {type: integer, format: int64}
        folio: {type: string}
        proveedorId: {type: integer, format: int64}
        fechaPago: {type: string, format: date-time}
        monto: {type: number}
        medio: {type: string}
        referencia: {type: string, nullable: true}
        estado: {type: string, enum: [REGISTRADO, CONFIRMADO]}
        asientoContableId: {type: integer, format: int64, nullable: true}
        fechaContable: {type: string, format: date, nullable: true}
        aplicaciones:
          type: array
          items:
            type: object
            required: [cuentaPorPagarId, montoAplicado]
            properties:
              cuentaPorPagarId: {type: integer, format: int64}
              montoAplicado: {type: number}
    FacturaProveedorWrite:
      type: object
      required: [ordenCompraId, numeroFacturaProveedor, fechaEmision, fechaVencimiento, detalles]
      properties:
        ordenCompraId: { type: integer, format: int64, minimum: 1 }
        numeroFacturaProveedor: { type: string, minLength: 1, maxLength: 60 }
        fechaEmision: { type: string, format: date }
        fechaVencimiento: { type: string, format: date }
        detalles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DetalleFacturaProveedorWrite' }
    DetalleFacturaProveedorWrite:
      type: object
      required: [detalleOrdenCompraId, cantidadFacturada, precioUnitario, descuentoPct, tasaImpuesto]
      properties:
        detalleOrdenCompraId: { type: integer, format: int64, minimum: 1 }
        cantidadFacturada: { type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.001 }
        precioUnitario: { type: number, minimum: 0, multipleOf: 0.01 }
        descuentoPct: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        tasaImpuesto: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
    FacturaProveedor:
      allOf:
      - { $ref: '#/components/schemas/FacturaProveedorWrite' }
      - type: object
        required: [id, folioInterno, proveedorId, subtotal, impuestos, total, estado]
        properties:
          id: { type: integer, format: int64 }
          folioInterno: { type: string }
          proveedorId: { type: integer, format: int64 }
          subtotal: { type: number, multipleOf: 0.01 }
          impuestos: { type: number, multipleOf: 0.01 }
          total: { type: number, multipleOf: 0.01 }
          estado: { type: string, enum: [REGISTRADA, VALIDADA] }
          asientoContableId: { type: integer, format: int64, nullable: true }
    ConfiguracionFacturaProveedorWrite:
      type: object
      required: [ivaAcreditableCuentaId, cuentasPorPagarCuentaId]
      properties:
        ivaAcreditableCuentaId: { type: integer, format: int64, minimum: 1 }
        cuentasPorPagarCuentaId: { type: integer, format: int64, minimum: 1 }
    CuentaPorPagar:
      type: object
      required: [id, facturaProveedorId, proveedorId, asientoContableId, montoOriginal, saldoPendiente, fechaEmision, fechaVencimiento]
      properties:
