        claveIdempotencia: *id013
    FacturaLinea:
      type: object
      additionalProperties: false
      required: [id, detallePedidoId, productoId, cantidad, precioUnitario, descuentoPct, tasaImpuesto, subtotal, impuestos, total]
      properties:
        id: *id001
        detallePedidoId: *id001
        productoId: *id001
        cantidad: *id011
        precioUnitario: *id008
        descuentoPct: *id010
        tasaImpuesto: *id010
        subtotal: *id008
        impuestos: *id008
        total: *id008
    Factura:
      type: object
      additionalProperties: false
      required: [id, folio, pedidoId, clienteId, emitidaPorUsuarioId, fechaEmision, fechaVencimiento, subtotal, impuestos, total, estado, detalles]
      properties:
        id: *id001
        folio:
          type: string
          minLength: 1
          maxLength: 30
        pedidoId: *id001
        clienteId: *id001
        emitidaPorUsuarioId: *id001
        fechaEmision:
          type: string
          format: date
          description: Fecha de negocio en America/Mexico_City.
        fechaVencimiento:
          type: string
          format: date
          description: Igual a emisión para el incremento de contado.
        subtotal: *id008
        impuestos: *id008
        total: *id008
        estado:
          type: string
          enum: [EMITIDA]
        detalles:
          type: array
