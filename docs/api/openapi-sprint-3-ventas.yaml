openapi: 3.0.3
info:
  title: TechSupply ERP — Clientes y Ventas sprint 3
  version: 0.5.0
  description: 'Clientes, cotizaciones y creación/consulta y confirmación de pedidos y registro, consulta, confirmación cancelaciones y facturas comerciales internas implementadas. Decisiones del usuario:
    CONTADO sin acreditar pago, zona America/Mexico_City, respetar precio cotizado y permitir cancelar saldo tras
    despacho parcial. Detalles señalados como pendientes requieren decisión.'
servers:
- url: /api/v1
security:
- bearerAuth: []
x-implementation-status: implemented
paths:
  /customers:
    x-implementation-status: implemented
    get:
      operationId: listCustomers
      summary: Listar clientes
      description: 'Permiso: MAESTROS_CLIENTES_LEER. Orden por id ascendente.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Activo'
      responses:
        '200':
          description: Cliente o página de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createCustomer
      summary: Crear cliente
      description: 'Permiso: MAESTROS_CLIENTES_ADMIN. Límite de crédito distinto de cero requiere
        MAESTROS_CLIENTES_CREDITO_ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteWrite'
            example:
              codigo: CLI-001
              nombreRazonSocial: Cliente ejemplo
              limiteCredito: 0
              plazoCreditoDias: 0
      responses:
        '201':
          description: Cliente o página de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /customers/{id}:
    x-implementation-status: implemented
    get:
      operationId: getCustomer
      summary: Consultar cliente
      description: 'Permiso: MAESTROS_CLIENTES_LEER. '
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cliente o página de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      operationId: updateCustomer
      summary: Actualizar cliente
      description: 'Permiso: MAESTROS_CLIENTES_ADMIN. Un cambio de límite requiere además MAESTROS_CLIENTES_CREDITO_ADMIN.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteWrite'
      responses:
        '200':
          description: Cliente o página de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /customers/{id}/status:
    x-implementation-status: implemented
    patch:
      operationId: setCustomerStatus
      summary: Activar o desactivar cliente
      description: 'Permiso: MAESTROS_CLIENTES_ADMIN. '
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoCliente'
            example:
              activo: false
      responses:
        '200':
          description: Cliente o página de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/quotes:
    x-implementation-status: implemented
    get:
      operationId: listSalesQuotes
      summary: Listar cotizaciones
      description: 'Permiso: VENTAS_COTIZACIONES_LEER. Orden por id descendente.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: Cotización o página de cotizaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createSalesQuote
      summary: Crear cotización
      description: 'Permiso: VENTAS_COTIZACIONES_REGISTRAR. No reserva existencias. Base e impuesto se redondean
        por línea a dos decimales con HALF_UP; el impuesto se calcula sobre la base sin redondear.
        Un reintento solo es equivalente si corresponde al mismo vendedor autenticado.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizacionCreate'
            example:
              clienteId: 1
              vigenciaHasta: '2026-11-30'
              claveIdempotencia: cot-2026-001
              detalles:
              - productoId: 10
                cantidad: 3
                precioUnitario: 10
                descuentoPct: 0
                tasaImpuesto: 16
      responses:
        '201':
          description: Cotización o página de cotizaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotizacion'
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
                format: uri-reference
        '200':
          description: Reintento equivalente; devuelve el recurso existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotizacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/quotes/{id}:
    x-implementation-status: implemented
    get:
      operationId: getSalesQuote
      summary: Consultar cotización
      description: 'Permiso: VENTAS_COTIZACIONES_LEER. '
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cotización o página de cotizaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotizacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/quotes/{id}/issue:
    x-implementation-status: implemented
    post:
      operationId: IssueSalesQuote
      summary: Emitir cotización
      description: 'Permiso: VENTAS_COTIZACIONES_ADMIN. Pasa de BORRADOR a VIGENTE.'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cotización o página de cotizaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotizacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/quotes/{id}/accept:
    x-implementation-status: implemented
    post:
      operationId: AcceptSalesQuote
      summary: Aceptar cotización
      description: 'Permiso: VENTAS_COTIZACIONES_ADMIN. Acepta una cotización vigente dentro de su vigencia;
        la fecha usa America/Mexico_City y la aceptación interna la registra un usuario autorizado.'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cotización o página de cotizaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotizacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/quotes/{id}/cancel:
    x-implementation-status: implemented
    post:
      operationId: CancelSalesQuote
      summary: Cancelar cotización
      description: 'Permiso: VENTAS_COTIZACIONES_ADMIN. Cancela desde BORRADOR o VIGENTE; no elimina el
        documento. Repetir la cancelación devuelve 409.'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cotización o página de cotizaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotizacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/orders:
    x-implementation-status: implemented
    get:
      operationId: listSalesOrders
      summary: Listar pedidos
      description: 'Permiso: VENTAS_PEDIDOS_LEER. Orden por id descendente.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createSalesOrder
      summary: Convertir cotización en pedido
      description: 'Permiso: VENTAS_PEDIDOS_REGISTRAR. Crea BORRADOR desde cotización aceptada y vigente, sin reservar stock.
        Requiere cliente, almacén y productos activos. Un reintento equivalente del mismo actor devuelve el pedido
        existente aun si posteriormente venció la cotización; otra clave para la misma cotización o un contenido
        distinto para la clave devuelve 409. El último día de vigencia es inclusivo en Ciudad de México.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCreate'
            example:
              cotizacionId: 1
              almacenId: 1
              modalidad: CONTADO
              claveIdempotencia: ped-2026-001
      responses:
        '201':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
                format: uri-reference
        '200':
          description: Reintento equivalente; devuelve el recurso existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/orders/{id}:
    x-implementation-status: implemented
    get:
      operationId: getSalesOrder
      summary: Consultar pedido
      description: 'Permiso: VENTAS_PEDIDOS_LEER.'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/orders/{id}/confirm:
    x-implementation-status: implemented
    post:
      operationId: confirmSalesOrder
      summary: Validar y confirmar pedido
      description: 'Permiso: VENTAS_PEDIDOS_CONFIRMAR. Cotización aceptada y vigente; valida cliente, almacén, productos
        y condiciones pactadas. Reserva todas las líneas en una transacción sin movimiento de kardex. Repetir
        la confirmación de un pedido confirmado devuelve 200 sin duplicar efectos. Se respetan precio y descuento aceptados.'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/orders/{id}/cancel:
    x-implementation-status: implemented
    post:
      operationId: cancelSalesOrder
      summary: Cancelar pedido y liberar reserva
      description: 'Permiso: VENTAS_PEDIDOS_CANCELAR. Cancela borrador, confirmado o parcialmente despachado; rechaza si
        hay despachos en borrador, libera la reserva pendiente y conserva despachos y movimientos confirmados. El motivo
        se recorta; reintento con el mismo motivo devuelve 200, uno distinto o una cancelación histórica sin metadatos
        devuelve 409. No se cancelan pedidos completamente despachados.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarRequest'
            example:
              motivo: Solicitud del cliente
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/dispatches:
    x-implementation-status: implemented
    get:
      operationId: listSalesDispatches
      summary: Listar despachos
      description: 'Permiso: VENTAS_DESPACHOS_LEER. Orden por id descendente.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DespachoPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createSalesDispatch
      summary: Registrar despacho pendiente
      description: 'Permiso: VENTAS_DESPACHOS_REGISTRAR. Pedido confirmado o parcialmente despachado; cada cantidad debe
        caber en la reserva y el saldo de la línea descontando otros despachos en borrador. No modifica existencias;
        el costo se fija al confirmar. Clave recortada única entre despachos: reintento con mismo actor, pedido y
        líneas equivalentes devuelve 200; clave con distinto contenido o actor devuelve 409.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DespachoCreate'
            example:
              pedidoId: 1
              claveIdempotencia: des-2026-001
              detalles:
              - detallePedidoId: 1
                cantidad: 2
      responses:
        '201':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Despacho'
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
                format: uri-reference
        '200':
          description: Reintento equivalente; devuelve el recurso existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Despacho'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/dispatches/{id}:
    x-implementation-status: implemented
    get:
      operationId: getSalesDispatch
      summary: Consultar despacho
      description: 'Permiso: VENTAS_DESPACHOS_LEER.'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Despacho'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/dispatches/{id}/confirm:
    x-implementation-status: implemented
    post:
      operationId: confirmSalesDispatch
      summary: Confirmar despacho
      description: 'Permiso: VENTAS_DESPACHOS_CONFIRMAR. Valida el borrador y registra el costo promedio vigente, salida,
        reserva, pedido y auditoría en una transacción. Repetir una confirmación exitosa devuelve 200 sin duplicar efectos.'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Despacho'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/dispatches/{id}/cancel:
    x-implementation-status: implemented
    post:
      operationId: cancelSalesDispatch
      summary: Cancelar despacho pendiente
      description: 'Permiso: VENTAS_DESPACHOS_REGISTRAR. Cancela solo BORRADOR y libera su asignación para otros despachos; no libera la reserva del pedido. Reintentar devuelve 200.'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Despacho'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/invoices:
    x-implementation-status: implemented
    get:
      operationId: listSalesInvoices
      summary: Listar facturas comerciales internas
      description: 'Permiso: VENTAS_FACTURAS_LEER. Orden por identificador descendente.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: Página de facturas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: emitSalesInvoice
      summary: Emitir factura comercial interna
      description: 'Permiso: VENTAS_FACTURAS_EMITIR. Pedido completamente despachado y respaldado por salidas confirmadas.
        No genera CFDI, cobro, cuenta por cobrar ni asiento. Una factura por pedido. Misma clave, actor y pedido devuelve
        200; clave con otro contenido o pedido ya facturado con otra clave devuelve 409.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaCreate'
            example:
              pedidoId: 1
              claveIdempotencia: factura-2026-001
      responses:
        '201':
          description: Factura emitida
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
        '200':
          description: Reintento equivalente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/invoices/{id}:
    x-implementation-status: implemented
    get:
      operationId: getSalesInvoice
      summary: Consultar factura comercial interna
      description: 'Permiso: VENTAS_FACTURAS_LEER.'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Factura emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: &id001
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ClienteId:
      name: clienteId
      in: query
      schema: *id001
    PedidoId:
      name: pedidoId
      in: query
      schema: *id001
    Activo:
      name: activo
      in: query
      schema:
        type: boolean
  responses:
    BadRequest:
      description: Entrada o parámetro inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Autenticación ausente o inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Permiso insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso o referencia no encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Estado, validación, disponibilidad o idempotencia en conflicto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
      - status
      - code
      - message
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
    ClienteWrite:
      type: object
      required:
      - codigo
      - nombreRazonSocial
      - limiteCredito
      - plazoCreditoDias
      properties:
        codigo: &id002
          type: string
          minLength: 1
          maxLength: 20
        nombreRazonSocial: &id003
          type: string
          minLength: 1
          maxLength: 160
        identificadorFiscal: &id004
          type: string
          maxLength: 20
          nullable: true
        correo: &id005
          type: string
          format: email
          maxLength: 150
          nullable: true
        telefono: &id006
          type: string
          maxLength: 30
          nullable: true
        direccion: &id007
          type: string
          nullable: true
        limiteCredito: &id008
          type: number
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          description: Decimal exacto; hasta 12 enteros y 2 decimales.
        plazoCreditoDias: &id009
          type: integer
          minimum: 0
          maximum: 32767
    Cliente:
      type: object
      additionalProperties: false
      required:
      - id
      - codigo
      - nombreRazonSocial
      - limiteCredito
      - plazoCreditoDias
      - activo
      properties:
        id: *id001
        codigo: *id002
        nombreRazonSocial: *id003
        identificadorFiscal: *id004
        correo: *id005
        telefono: *id006
        direccion: *id007
        limiteCredito: *id008
        plazoCreditoDias: *id009
        activo:
          type: boolean
    EstadoCliente:
      type: object
      required:
      - activo
      properties:
        activo:
          type: boolean
    LineaComercialWrite:
      type: object
      required:
      - productoId
      - cantidad
      - precioUnitario
      - descuentoPct
      - tasaImpuesto
      properties:
        productoId: *id001
        cantidad: &id011
          type: number
          minimum: 0
          maximum: 99999999999.999
          multipleOf: 0.001
          description: Decimal exacto; hasta 11 enteros y 3 decimales.
          exclusiveMinimum: true
        precioUnitario: *id008
        descuentoPct: &id010
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
        tasaImpuesto: *id010
    CotizacionCreate:
      type: object
      required:
      - clienteId
      - vigenciaHasta
      - claveIdempotencia
      - detalles
      properties:
        clienteId: *id001
        vigenciaHasta: &id012
          type: string
          format: date
          description: Fecha de negocio America/Mexico_City; el último día es inclusivo.
        claveIdempotencia: &id013
          type: string
          minLength: 1
          maxLength: 100
          description: 'Clave única por tipo de documento y recortada; el reintento con contenido equivalente devuelve el documento
            existente y el contenido distinto produce conflicto.'
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineaComercialWrite'
    CotizacionLinea:
      type: object
      additionalProperties: false
      required:
      - id
      - productoId
      - cantidad
      - precioUnitario
      - descuentoPct
      - tasaImpuesto
      properties:
        id: *id001
        productoId: *id001
        cantidad: *id011
        precioUnitario: *id008
        descuentoPct: *id010
        tasaImpuesto: *id010
    Cotizacion:
      type: object
      additionalProperties: false
      required:
      - id
      - folio
      - clienteId
      - vendedorUsuarioId
      - fecha
      - vigenciaHasta
      - estado
      - subtotal
      - impuestos
      - total
      - detalles
      properties:
        id: *id001
        folio:
          type: string
          minLength: 1
          maxLength: 30
        clienteId: *id001
        fecha:
          type: string
          format: date-time
        vigenciaHasta: *id012
        estado:
          type: string
          description: Última transición guardada; la fecha de vencimiento no cambia el estado automáticamente.
          enum:
          - BORRADOR
          - VIGENTE
          - ACEPTADA
          - VENCIDA
          - CANCELADA
        subtotal: *id008
        impuestos: *id008
        total: *id008
        detalles:
          type: array
          description: Puede estar vacío si procede de datos preexistentes incompletos; emitir o aceptar requiere líneas.
          items:
            $ref: '#/components/schemas/CotizacionLinea'
        vendedorUsuarioId: *id001
    PedidoCreate:
      type: object
      required:
      - cotizacionId
      - almacenId
      - modalidad
      - claveIdempotencia
      properties:
        cotizacionId: *id001
        almacenId: *id001
        modalidad:
          type: string
          enum:
          - CONTADO
        claveIdempotencia: *id013
    PedidoLinea:
      type: object
      additionalProperties: false
      required:
      - id
      - productoId
      - cantidad
      - precioUnitario
      - descuentoPct
      - tasaImpuesto
      - cantidadReservada
      - cantidadDespachada
      properties:
        id: *id001
        productoId: *id001
        cantidad: *id011
        precioUnitario: *id008
        descuentoPct: *id010
        tasaImpuesto: *id010
        cantidadReservada: &id014
          type: number
          minimum: 0
          maximum: 99999999999.999
          multipleOf: 0.001
          description: Decimal exacto; hasta 11 enteros y 3 decimales.
        cantidadDespachada: *id014
    Pedido:
      type: object
      additionalProperties: false
      required:
      - id
      - folio
      - cotizacionId
      - clienteId
      - almacenId
      - creadoPorUsuarioId
      - modalidad
      - estado
      - fecha
      - subtotal
      - impuestos
      - total
      - detalles
      - vendedorUsuarioId
      - motivoCancelacion
      - canceladoPorUsuarioId
      - canceladoEn
      properties:
        id: *id001
        folio:
          type: string
          minLength: 1
          maxLength: 30
        cotizacionId: *id001
        clienteId: *id001
        almacenId: *id001
        creadoPorUsuarioId: *id001
        modalidad:
          type: string
          enum:
          - CONTADO
          description: Modalidad comercial; no acredita pago.
        estado:
          type: string
          enum:
          - BORRADOR
          - CONFIRMADO
          - PARCIALMENTE_DESPACHADO
          - DESPACHADO
          - CANCELADO
        fecha:
          type: string
          format: date-time
        subtotal: *id008
        impuestos: *id008
        total: *id008
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/PedidoLinea'
        motivoCancelacion:
          type: string
          nullable: true
          maxLength: 1000
        canceladoPorUsuarioId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        canceladoEn:
          type: string
          format: date-time
          nullable: true
        vendedorUsuarioId:
          type: integer
          format: int64
          minimum: 1
          description: Vendedor de la cotización; se conserva al convertir.
    DespachoLineaWrite:
      type: object
      required:
      - detallePedidoId
      - cantidad
      properties:
        detallePedidoId: *id001
        cantidad: *id011
    DespachoCreate:
      type: object
      required:
      - pedidoId
      - claveIdempotencia
      - detalles
      properties:
        pedidoId: *id001
        claveIdempotencia: *id013
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DespachoLineaWrite'
    DespachoLinea:
      type: object
      additionalProperties: false
      required:
      - id
      - detallePedidoId
      - cantidad
      - costoUnitario
      properties:
        id: *id001
        detallePedidoId: *id001
        cantidad: *id011
        costoUnitario:
          type: number
          minimum: 0
          maximum: 999999999999.9999
          multipleOf: 0.0001
          description: Nulo hasta confirmar; numeric(16,4) al aplicar.
          nullable: true
    Despacho:
      type: object
      additionalProperties: false
      required:
      - id
      - folio
      - pedidoId
      - almacenId
      - registradoPorUsuarioId
      - fecha
      - estado
      - detalles
      properties:
        id: *id001
        folio:
          type: string
          minLength: 1
          maxLength: 30
        pedidoId: *id001
        almacenId: *id001
        registradoPorUsuarioId: *id001
        fecha:
          type: string
          format: date-time
        estado:
          type: string
          enum:
          - BORRADOR
          - CONFIRMADO
          - CANCELADO
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DespachoLinea'
    FacturaCreate:
      type: object
